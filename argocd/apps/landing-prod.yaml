# neki-landing - overlays/prod 의 landing-*.yaml 만 골라 동기화한다.
# directory.include 로 neki-prod(kustomize)와 리소스를 나눈다. landing 매니페스트를 추가하면 include 에도 넣는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Team-Neki/Team-Neki-GitOps.git
    targetRevision: main
    path: overlays/prod
    directory:
      include: '{landing-deployment.yaml,landing-ingressroute-https.yaml,landing-certificate.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
