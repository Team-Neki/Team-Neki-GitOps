# Neki Admin 환경변수 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 admin-web-secret.yaml 로 복사
#   2) 실제 값 채우기
#   3) kubectl apply -f overlays/prod/admin-web-secret.yaml
#
# admin-web-secret.yaml 은 .gitignore(**/admin-web-secret.yaml)에 등록되어 커밋되지 않는다.
# 그래도 민감 정보는 절대 커밋 금지.
#
# ConfigMap 은 두지 않고 비민감 값까지 여기 모은다. deployment 의 envFrom 도
# secretRef 하나뿐이라 환경변수의 출처가 한 곳으로 고정된다.
#
# stringData 이므로 평문으로 적는다. base64 는 API 서버가 저장할 때 알아서 한다.
# data: 로 바꾸면 그때는 모든 값이 base64 여야 한다.
#
# ⚠️ 아래 이름들은 현재 Team-Neki-Admin 코드가 읽지 않는다. 관리자 백엔드와
# 오픈뱅킹 OAuth 가 붙는 것을 전제로 미리 맞춰 둔 이름이다. 코드가 실제로 읽는
# 이름은 README 의 "Secret" 절 표를 참고한다.
apiVersion: v1
kind: Secret
metadata:
  name: neki-admin-web-secret
  namespace: prod
type: Opaque
stringData:
  TZ: "Asia/Seoul"

  # Amplitude 조회 키. Amplitude → Settings → Projects → General 의 API Key / Secret Key.
  # REGION 은 프로젝트가 EU 리전일 때만 "eu", 그 외에는 "us".
  AMPLITUDE_API_KEY: "REPLACE_WITH_AMPLITUDE_API_KEY"
  AMPLITUDE_SECRET_KEY: "REPLACE_WITH_AMPLITUDE_SECRET_KEY"
  AMPLITUDE_REGION: "us"

  # "mock" 이면 화면 검증용 목 데이터를 쓴다. 운영에서는 "live".
  GROUP_ACCOUNT_DATA_MODE: "live"

  # 금융결제원 오픈뱅킹 모임통장 연동.
  # REDIRECT_URI 는 오픈뱅킹 콘솔에 등록한 값과 정확히 같아야 하고,
  # 그 호스트를 받는 IngressRoute 가 실제로 있어야 콜백이 닿는다.
  OPENBANKING_BASE_URL: "https://openapi.openbanking.or.kr/"
  OPENBANKING_CLIENT_ID: "REPLACE_WITH_CLIENT_ID"
  OPENBANKING_CLIENT_SECRET: "REPLACE_WITH_CLIENT_SECRET"
  OPENBANKING_REDIRECT_URI: "https://admin.suitestudy.com:4641/api/group-account/oauth/callback"
  OPENBANKING_SCOPE: "login inquiry"
  OPENBANKING_AUTH_TYPE: "0"
  OPENBANKING_CLIENT_USE_CODE: ""
