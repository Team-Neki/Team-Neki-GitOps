# Neki Admin 환경변수 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 admin-web-secret.yaml 로 복사
#   2) 실제 값 채우기
#   3) kubectl apply -f overlays/prod/admin-web-secret.yaml
#
# admin-web-secret.yaml 은 .gitignore(**/admin-web-secret.yaml)에 등록되어 커밋되지 않는다.
# 그래도 민감 정보는 절대 커밋 금지.
#
# ConfigMap 을 따로 두지 않고 비민감 값까지 여기 모은다. 앱이 읽는 환경변수는 전부
# 이 Secret 하나에서 오고, deployment 의 envFrom 도 secretRef 하나뿐이다.
# 값을 추가하면 앱이 실제로 그 이름을 읽는지 먼저 확인한다. 읽지 않는 이름은
# 파드를 정상 기동시킨 채 화면만 비게 만들어 원인이 드러나지 않는다.
apiVersion: v1
kind: Secret
metadata:
  name: neki-admin-web-secret
  namespace: prod
type: Opaque
stringData:
  TZ: "Asia/Seoul"

  # 모임통장(금융결제원 오픈뱅킹) 연동.
  # GROUP_ACCOUNT_DATA_MODE 는 "mock" 일 때만 목 데이터를 쓰는 개발용 스위치다.
  # 운영에서는 빈 값으로 둔다.
  # 이용기관 승인 + 계좌 명의자 동의 + 거래내역 API 권한이 모두 준비되기 전까지
  # 아래 네 값은 빈 문자열로 둔다. 비어 있으면 앱이 "연결 전" 으로 표시하고
  # 외부 호출을 하지 않는다.
  GROUP_ACCOUNT_DATA_MODE: ""
  OPENBANKING_BASE_URL: ""
  OPENBANKING_ACCESS_TOKEN: ""
  OPENBANKING_FINTECH_USE_NUM: ""
  OPENBANKING_BANK_TRAN_ID: ""

  # 관리자 백엔드 API. 아직 떠 있지 않아 지금은 넣지 않는다.
  # 백엔드가 뜨면 주석을 풀고 각 endpoint 의 전체 URL 을 넣는다.
  #   NEKI_ADMIN_DASHBOARD_API_URL -> app/api/amplitude/dashboard 가 프록시할 주소
  #   NEKI_ADMIN_ANALYTICS_API_URL -> app/api/amplitude/metrics 가 프록시할 주소
  # 없는 동안 두 API 는 503 admin_api_not_configured 로 응답하고 대시보드는 빈 채로 뜬다.
  # NEKI_ADMIN_DASHBOARD_API_URL: ""
  # NEKI_ADMIN_ANALYTICS_API_URL: ""
