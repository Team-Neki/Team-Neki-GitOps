# Neki Admin Secret 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 admin-web-secret.yaml 로 복사
#   2) 실제 값 채우기
#   3) kubectl apply -f overlays/prod/admin-web-secret.yaml
#
# admin-web-secret.yaml 은 .gitignore(**/admin-web-secret.yaml)에 등록되어 커밋되지 않는다.
# 그래도 민감 정보는 절대 커밋 금지.
apiVersion: v1
kind: Secret
metadata:
  name: neki-admin-web-secret
  namespace: prod
type: Opaque
stringData:
  # Amplitude 조회 키.
  #
  # 주의: 키 이름이 NEKI_PROD_ 접두사다. Team-Neki-Admin 의 README 와
  # .env.local.example 은 AMPLITUDE_API_KEY / AMPLITUDE_SECRET_KEY 로 적고 있지만
  # 실제 코드(app/api/amplitude/amplitude-client.ts)가 읽는 이름은 아래 두 개이고
  # fallback 이 없다. 접두사 없는 이름으로 넣으면 파드는 정상 기동하고 대시보드만
  # "API 키 미설정" 안내 화면으로 뜬다.
  #
  # Amplitude → Settings → Projects → 해당 프로젝트 → General 의 API Key / Secret Key
  NEKI_PROD_AMPLITUDE_API_KEY: "REPLACE_WITH_AMPLITUDE_API_KEY"
  NEKI_PROD_AMPLITUDE_SECRET_KEY: "REPLACE_WITH_AMPLITUDE_SECRET_KEY"

  # 금융결제원 오픈뱅킹 모임통장 연동.
  # 이용기관 승인 + 계좌 명의자 동의 + 거래내역 API 권한이 모두 준비되기 전까지는
  # 빈 문자열로 둔다. 빈 값이면 앱이 "연결 전" 상태로 표시하고 외부 호출을 하지 않는다.
  OPENBANKING_BASE_URL: ""
  OPENBANKING_ACCESS_TOKEN: ""
  OPENBANKING_FINTECH_USE_NUM: ""
  OPENBANKING_BANK_TRAN_ID: ""
