apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - notification-deployment.yaml
  - ingress.yaml
  - ingressroute-https.yaml
  - certificate.yaml
  - monitoring.yaml
  - monitoring-ingressroute.yaml
  - sprint-deployment.yaml
  - sprint-config.yaml
  - sprint-ingressroute-https.yaml
  - admin-web-deployment.yaml
  - admin-web-ingressroute-https.yaml
  # portal 은 별도 레포(Team-Neki-Portal)로 분리 - argocd/apps/portal.yaml Application 이 관리
  # secret.yaml / sprint-secret.yaml / admin-web-secret.yaml 은 .gitignore 처리 - 민감 정보 별도 관리
  # sprint-secret.example.yaml / admin-web-secret.example.yaml 은 문서용이므로 kustomize에 포함하지 않음
  # - secret.yaml
  # tls-secret.yaml 은 cert-manager Certificate로 대체됨 (deprecated)
  # - tls-secret.yaml

# Grafana 대시보드 JSON → ConfigMap grafana-dashboards (Grafana 가 /var/lib/grafana/dashboards 로 마운트)
# 대시보드를 추가/수정하려면 dashboards/*.json 을 고치고 여기 목록에 넣는다
configMapGenerator:
  - name: grafana-dashboards
    namespace: prod
    files:
      - dashboards/observability-dashboard.json
      - dashboards/spring-boot-dashboard.json
      - dashboards/neki-api-apm.json
      - dashboards/neki-api-endpoint.json

generatorOptions:
  disableNameSuffixHash: true
