apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  # neki-notification Deployment 는 BACKEND-135 로 Server apps/batch + Prefect(overlays/prefect)로 옮겨져 제거됨.
  # 이 제거는 prefect-workflow Secret 에 firebase-service-account.json 키가 들어가고 weekend-explore 수동 실행으로
  # 전달이 확인된 뒤에만 반영한다 (Server docs/hld/2026-10-06-notification-push-hld.md 11절 7단계)
  - ingress.yaml
  - ingressroute-https.yaml
  - certificate.yaml
  # portal 은 별도 레포(Team-Neki-Portal)로 분리 - argocd/apps/portal.yaml Application 이 관리
  # sprint-*.yaml 은 argocd/apps/sprint-prod.yaml Application 이 관리 - 여기 넣으면 두 Application 이 같은 리소스를 잡는다
  # monitoring/ (Prometheus / Grafana / Loki / Promtail) 은 argocd/apps/monitoring-prod.yaml Application 이 관리
  # admin-web-*.yaml 은 argocd/apps/admin-web-prod.yaml Application 이 관리 - 여기 넣으면 두 Application 이 같은 리소스를 잡는다
  # secret.yaml / sprint-secret.yaml / admin-web-secret.yaml 은 .gitignore 처리 - 민감 정보 별도 관리
  # sprint-secret.example.yaml / admin-web-secret.example.yaml 은 문서용이므로 kustomize에 포함하지 않음
  # - secret.yaml
  # tls-secret.yaml 은 cert-manager Certificate로 대체됨 (deprecated)
  # - tls-secret.yaml

