# NEKI 랜딩 페이지 (Team-Neki/neki-landing, nginx 로 서빙하는 정적 사이트).
#
# 이미지 태그는 이 파일에 직접 적는다 (admin-web / sprint 와 같은 방식).
# neki-landing 의 build 워크플로가 아래 image 줄을 커밋 sha 태그로 갱신하면 ArgoCD 가 롤링한다.
# 이 이미지는 반드시 한 곳에서만 참조한다(워크플로가 참조 개수를 세어 갱신을 검증한다).
# nginx 설정(nginx/default.conf)은 이미지에 들어 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neki-landing
  namespace: prod
  labels:
    app: neki-landing
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: neki-landing
  template:
    metadata:
      labels:
        app: neki-landing
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          # 첫 CI 실행 전에는 :main 을 가리킨다. 이후에는 워크플로가 sha 태그로 바꾼다.
          image: ghcr.io/team-neki/neki-landing:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: neki-landing-service
  namespace: prod
  labels:
    app: neki-landing
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: neki-landing
