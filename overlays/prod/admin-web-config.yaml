# Neki Admin 비민감 환경변수. 민감값(Amplitude 키, 오픈뱅킹 토큰)은
# neki-admin-web-secret 에서 주입한다 (admin-web-secret.example.yaml 참고).
apiVersion: v1
kind: ConfigMap
metadata:
  name: neki-admin-web-config
  namespace: prod
data:
  NODE_ENV: "production"
  TZ: "Asia/Seoul"

  # Amplitude 일별 집계 캐시(SQLite) 파일 위치.
  # admin-web-deployment.yaml 의 volumeMounts.mountPath(/app/.data)와 반드시
  # 같은 디렉토리를 가리켜야 한다. 여기만 바꾸면 캐시가 PVC 밖(컨테이너
  # 레이어)에 생겨 파드 재시작마다 사라진다.
  # 이 파일은 HTTP 로 노출되지 않는다 (Next.js 는 public/, .next/static/ 만 서빙).
  NEKI_ADMIN_DATABASE_PATH: "/app/.data/neki-admin.sqlite"

  # Amplitude 프로젝트가 EU 리전일 때만 "eu". 그 외에는 "us".
  AMPLITUDE_REGION: "us"
  # 총 사용자 수를 누적할 시작일. Amplitude 프로젝트 생성일에 맞춰 조정한다.
  AMPLITUDE_PROJECT_START_DATE: "2024-01-01"
  # Amplitude 프로젝트 타임존과 일치해야 완료된 날짜가 자정에 확정된다.
  AMPLITUDE_TIME_ZONE: "Asia/Seoul"

  # 비워두면 모임통장은 "연결 전" 상태로 표시된다. mock 은 개발 환경 전용이므로
  # 운영에서는 절대 "mock" 으로 두지 않는다.
  GROUP_ACCOUNT_DATA_MODE: ""
