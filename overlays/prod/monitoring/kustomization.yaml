apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus / Grafana / Loki / Promtail - argocd/apps/monitoring-prod.yaml Application 이 관리 (neki-prod 와 분리)
resources:
  - monitoring.yaml
  - monitoring-ingressroute.yaml
  - certificate.yaml

# Grafana 대시보드 JSON → ConfigMap grafana-dashboards (Grafana 가 /var/lib/grafana/dashboards 로 마운트)
# 대시보드를 추가/수정하려면 dashboards/*.json 을 고치고 여기 목록에 넣는다
configMapGenerator:
  - name: grafana-dashboards
    namespace: prod
    files:
      - dashboards/observability-dashboard.json
      - dashboards/spring-boot-dashboard.json
      - dashboards/neki-api-apm.json
      - dashboards/neki-api-endpoint.json
      - dashboards/neki-api-request.json

generatorOptions:
  disableNameSuffixHash: true
