apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: yapp-prod-ingressroute-https
  namespace: prod
spec:
  entryPoints:
    - websecure
  routes:
    # /actuator 는 외부에 열지 않는다. Prometheus scrape 와 k8s probe 는 파드 IP 로 직접 접근한다
    - match: Host(`yapp.suitestudy.com`) && !PathPrefix(`/actuator`)
      kind: Rule
      services:
        - name: neki-prod-service
          port: 8080
  tls:
    secretName: neki-tls-cert
