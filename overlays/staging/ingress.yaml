# HTTP(web) 진입점. 표준 Ingress 로는 경로 제외 규칙을 쓸 수 없어 IngressRoute 로 둔다
# /actuator 는 외부에 열지 않는다. Prometheus scrape 와 k8s probe 는 파드 IP 로 직접 접근한다
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: yapp-staging-ingressroute-http
  namespace: staging
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dev-yapp.suitestudy.com`) && !PathPrefix(`/actuator`)
      kind: Rule
      services:
        - name: yapp-app-staging-service
          port: 8080
