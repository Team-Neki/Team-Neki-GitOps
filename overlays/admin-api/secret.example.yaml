# secret.yaml로 복사해 실제 값을 채운 뒤 직접 apply한다. secret.yaml은 gitignore 대상이다.
apiVersion: v1
kind: Secret
metadata:
  name: neki-admin-api-secret
  namespace: prod
type: Opaque
stringData:
  # DB 연결은 postgres 공통 설정과 기존 neki-secrets/JASYPT_PASSWORD를 사용한다.
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  # Google Console 등록값·인증 시작·code 교환 모두 같은 URI를 사용해야 한다.
  # Next 프록시 연결 전에는 개발 환경의 Spring 직접 콜백으로 검증한다.
  ADMIN_OAUTH_REDIRECT_URI: "https://REPLACE_WITH_EXTERNAL_HOST/login/oauth2/code/google"
