# Next 서버 프록시 또는 개발용 port-forward에서 접근한다. 외부 Ingress/NodePort는 두지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: neki-admin-api-service
  labels:
    app: neki-admin-api
spec:
  type: ClusterIP
  selector:
    app: neki-admin-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
