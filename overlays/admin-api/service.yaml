# 인증 도입 전까지 외부 Ingress/NodePort 없이 클러스터 내부에서만 접근한다.
apiVersion: v1
kind: Service
metadata:
  name: neki-admin-api-service
  labels:
    app: neki-admin-api
spec:
  type: ClusterIP
  selector:
    app: neki-admin-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
