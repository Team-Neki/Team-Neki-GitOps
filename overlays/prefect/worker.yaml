# Prefect Kubernetes Worker. 원본: prefect-helm 의 prefect-worker 차트 렌더링 결과를 kustomize 용으로 정리
# - work pool `neki-pool` (type: kubernetes). 없으면 initContainer 가 만든다
# - worker 와 flow run 이 같은 이미지(Team-Neki-Workflow)를 쓴다. 베이스 prefect 이미지에는
#   flows 가 없어 flow run 이 ModuleNotFoundError 로 죽는다
# - flow run 은 prefect 네임스페이스에 Job 으로 생성됨 (worker-base-job-template.json 의 namespace 기본값)
# - Role/RoleBinding 은 prefect 네임스페이스 안에서 Job/Pod 를 다룰 최소 권한
# 업그레이드: 이미지 태그는 Team-Neki-Workflow 의 build.yml 이 kustomization.yaml 의
# newTag 로 갱신한다. 여기서 직접 고치지 않는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prefect-worker
  namespace: prefect
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prefect-worker
  namespace: prefect
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "pods/log", "pods/status"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prefect-worker
  namespace: prefect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prefect-worker
subjects:
  - kind: ServiceAccount
    name: prefect-worker
    namespace: prefect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  namespace: prefect
  labels:
    app: prefect-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
    spec:
      serviceAccountName: prefect-worker
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # work pool 이 이미 있으면 base job template 을 ConfigMap 내용으로 동기화 (최초 기동 시엔 건너뜀)
        - name: sync-base-job-template
          image: prefecthq/prefect:3.8.5-python3.11-kubernetes
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              work_pool_name="neki-pool"
              # 서버가 아직 안 떠 있으면(동시 기동 시) API 가 응답할 때까지 최대 5분 대기
              i=0
              until python -c "import httpx, os, sys; sys.exit(0 if httpx.get(os.environ['PREFECT_API_URL'] + '/health', timeout=5).status_code == 200 else 1)" 2>/dev/null; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then echo "Prefect API not reachable after 5 minutes"; exit 1; fi
                echo "Waiting for Prefect API at $PREFECT_API_URL ..."
                sleep 5
              done
              if ! prefect work-pool inspect "$work_pool_name" > /dev/null 2>&1; then
                echo "Work pool $work_pool_name does not exist yet; the worker will create it on start."
                exit 0
              fi
              echo "Work pool $work_pool_name exists; syncing base job template..."
              prefect work-pool update "$work_pool_name" --base-job-template ./baseJobTemplate.json
          workingDir: /home/prefect
          env:
            - name: HOME
              value: /home/prefect
            - name: PREFECT_API_URL
              value: http://prefect-server.prefect.svc.cluster.local:4200/api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: scratch
              mountPath: /home/prefect
              subPathExpr: home
            - name: scratch
              mountPath: /tmp
              subPathExpr: tmp
            - name: base-job-template
              mountPath: /home/prefect/baseJobTemplate.json
              subPath: baseJobTemplate.json
        # deployments/ 를 Prefect API 에 등록한다. 이미지 안에서 돌므로 클러스터
        # 밖에서 서버에 접근할 필요가 없다 (서버는 외부에 노출되지 않는다).
        #
        # workingDir 이 /opt/prefect 여야 한다. to_deployment() 의 entrypoint 가
        # cwd 기준 상대경로(flows/<name>/flow.py:<fn>)로 잡히고, flow run Job 도
        # 같은 이미지의 WORKDIR 에서 그 경로를 푼다. 다른 데서 등록하면 entrypoint
        # 가 어긋나 flow run 이 import 에서 죽는다.
        #
        # 앞 initContainer 가 API 가 응답할 때까지 기다린 뒤에만 성공하므로
        # 여기서 다시 기다리지 않는다. 순서를 바꾸면 대기를 옮겨야 한다.
        - name: register-deployments
          image: ghcr.io/team-neki/team-neki-workflow
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # worker 도 기동 시 pool 을 만들지만 그건 initContainer 뒤다.
              # deploy.py 가 등록할 pool 이 먼저 있어야 하므로 없으면 만든다.
              if ! prefect work-pool inspect "$PREFECT_WORK_POOL" > /dev/null 2>&1; then
                echo "Work pool $PREFECT_WORK_POOL does not exist; creating..."
                prefect work-pool create "$PREFECT_WORK_POOL" --type kubernetes
              fi
              # WORKFLOW_IMAGE 는 이미지에 구워져 있어 job_variables.image 로 들어간다.
              python deploy.py
          workingDir: /opt/prefect
          env:
            - name: HOME
              value: /home/prefect
            - name: PREFECT_API_URL
              value: http://prefect-server.prefect.svc.cluster.local:4200/api
            - name: PREFECT_WORK_POOL
              value: neki-pool
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: scratch
              mountPath: /home/prefect
              subPathExpr: home
            - name: scratch
              mountPath: /tmp
              subPathExpr: tmp
      containers:
        - name: prefect-worker
          image: ghcr.io/team-neki/team-neki-workflow
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "-g", "--", "/opt/prefect/entrypoint.sh"]
          args:
            - prefect
            - worker
            - start
            - --type
            - kubernetes
            - --pool
            - neki-pool
            - --base-job-template
            - baseJobTemplate.json
          workingDir: /home/prefect
          env:
            - name: HOME
              value: /home/prefect
            - name: PREFECT_API_URL
              value: http://prefect-server.prefect.svc.cluster.local:4200/api
            - name: PREFECT_API_ENABLE_HTTP2
              value: "true"
            - name: PREFECT_WORKER_QUERY_SECONDS
              value: "5"
            - name: PREFECT_WORKER_PREFETCH_SECONDS
              value: "10"
            # kube-system Namespace UID (kubectl get ns kube-system -o jsonpath='{.metadata.uid}')
            - name: PREFECT_KUBERNETES_CLUSTER_UID
              value: e47c466b-9788-4ee1-9fb0-73a61c8fcd05
            # flow run Pod 이벤트를 관찰할 네임스페이스
            - name: PREFECT_INTEGRATIONS_KUBERNETES_OBSERVER_NAMESPACES
              value: prefect
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: scratch
              mountPath: /home/prefect
              subPathExpr: home
            - name: scratch
              mountPath: /tmp
              subPathExpr: tmp
            - name: base-job-template
              mountPath: /home/prefect/baseJobTemplate.json
              subPath: baseJobTemplate.json
      volumes:
        - name: scratch
          emptyDir: {}
        - name: base-job-template
          configMap:
            name: prefect-worker-base-job-template
