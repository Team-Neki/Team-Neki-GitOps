# Prefect 서버용 PostgreSQL 16 (단일 인스턴스, local-path PVC)
# 비밀번호는 secret.yaml(gitignore)의 prefect-db Secret에서 가져옴 - secret.example.yaml 참고
apiVersion: v1
kind: Service
metadata:
  name: prefect-postgres
  namespace: prefect
  labels:
    app: prefect-postgres
spec:
  selector:
    app: prefect-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prefect-postgres
  namespace: prefect
  labels:
    app: prefect-postgres
spec:
  serviceName: prefect-postgres
  replicas: 1
  selector:
    matchLabels:
      app: prefect-postgres
  template:
    metadata:
      labels:
        app: prefect-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: prefect
            - name: POSTGRES_USER
              value: prefect
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prefect-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "prefect", "-d", "prefect"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "prefect", "-d", "prefect"]
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
