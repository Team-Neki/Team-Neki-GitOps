# 워크플로(Team-Neki-Workflow) Secret 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 workflow-secret.yaml 로 복사
#   2) 실제 값 채우기
#   3) kubectl apply -f overlays/prefect/workflow-secret.yaml
#   4) 이미 flow run 이 돌고 있었다면 다음 run 부터 반영된다 (Job 파드가 뜰 때 읽는다)
#
# workflow-secret.yaml 은 .gitignore(**/workflow-secret.yaml)에 등록되어 커밋되지 않음.
#
# prefect-db Secret 과 다른 것이다. 그쪽은 Prefect 서버가 자기 상태를 쓰는
# 메타DB 비밀번호이고, 이쪽은 flow 가 바깥(Kakao, 앱 DB, S3)에 붙을 때 쓴다.
#
# 이 값들은 worker 가 아니라 flow run Job 파드가 읽는다. flow 는 Job 으로 뜨므로
# worker-base-job-template.json 의 envFrom 이 이 Secret 을 참조한다. worker.yaml 에
# env 를 넣어도 flow 에는 전달되지 않는다.
#
# 이 Secret 이 클러스터에 없으면 모든 flow run Job 파드가 CreateContainerConfigError
# 로 뜨지 않는다. 키를 추가할 때는 이 파일도 같이 갱신한다.
apiVersion: v1
kind: Secret
metadata:
  name: prefect-workflow
  namespace: prefect
type: Opaque
stringData:
  # Kakao Developers > 앱 > 플랫폼 키 > REST API 키.
  # 픽닷/모노맨션/포토그레이/하루필름/포토랩플러스/비룸스튜디오는 수집원이
  # Kakao 라 이 값이 없으면 아예 못 돈다. 나머지 브랜드는 돌지만 좌표 보정만
  # 건너뛴다.
  KAKAO_API_KEY: ""

  # flow 가 적재하는 앱 DB (Team-Neki-Server 가 쓰는 PostgreSQL). psycopg 접속 문자열.
  #   postgresql://USER:PASSWORD@HOST:5432/DATABASE
  # 파드에서 붙으므로 HOST 는 localhost 가 아니라 노드 IP(192.168.219.106) 또는
  # 클러스터 Service 주소여야 한다. prefect-db 와 같은 호스트 PostgreSQL 이라면
  # pg_hba.conf 가 이미 파드 CIDR 을 허용하고 있다.
  #
  # 읽는 flow:
  #   - legal-dong (법정동 코드 수집, 매월 1일 05:00)
  #   - subway-station (지하철 역 정보 수집, 매월 1일 06:00)
  # 둘 다 이 값이 없으면 flows/common/postgres.py 가 RuntimeError 로 바로 실패한다.
  # 조용히 건너뛰지 않는다.
  #
  # 비밀번호가 URL 안에 들어가므로 @ : / ? 가 있으면 percent-encoding 하거나
  # 영숫자만 쓴다.
  DATABASE_URL: ""

  # 지점 수집 flow (stores-collect 와 브랜드별 *-stores) 가 결과를 적재하는 S3 버킷.
  # raw/ collect/ runs/ 접두로 쓴다. 버킷은 미리 만들어 둔다. flow 는 만들지 않는다.
  # 없으면 flows/common/storage.py 가 적재 시점에 RuntimeError 로 실패한다.
  #
  # k3s 에서는 LocalStack 을 쓰지 않고 실제 S3 만 쓴다. 버킷은 환경 접두를 붙여
  # 둘로 나눈다.
  #   staging-team-neki-workflow
  #   prod-team-neki-workflow
  # Prefect 는 단일 인스턴스라 이 값 하나가 이 클러스터의 flow 가 어느 환경에
  # 쓰는지를 정한다. DATABASE_URL 이 가리키는 앱 DB 와 같은 환경이어야 한다.
  # (dev_yapp 이면 staging-, 운영 DB 면 prod-)
  S3_BUCKET: "staging-team-neki-workflow"

  # S3 자격증명. IAM role 이 없어 boto3 기본 자격증명 체인이 이 환경변수를 집어간다.
  # IAM 사용자 정책에 두 버킷(staging-, prod-)의 s3:PutObject, s3:GetObject,
  # s3:ListBucket 이 있어야 한다. 환경을 바꿀 때 키까지 갈아끼우지 않기 위해서다. 읽기 권한도 필요한 이유는 latest_dt 가 목록 조회로 최신 파티션을
  # 찾고, 실패한 브랜드를 이전 파티션으로 대신할 때 read_stores 가 읽기 때문이다.
  #
  # AWS_PROFILE, AWS_CONFIG_FILE, AWS_ENDPOINT_URL 은 넣지 않는다. 셋 다 로컬
  # LocalStack 용이라 파드에 들어가면 실제 S3 대신 localhost 를 가리킨다.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "ap-northeast-2"
