# Prefect DB Secret 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 secret.yaml 로 복사
#   2) password 를 실제 값으로 교체 (예: openssl rand -base64 24)
#   3) kubectl apply -f overlays/prefect/secret.yaml
#
# secret.yaml 은 .gitignore(**/secret.yaml)에 등록되어 커밋되지 않음.
# prefect-server 가 호스트 PostgreSQL(192.168.219.106:5432) 의 prefect role 로 접속할 때 쓰는 비밀번호.
# 호스트 DB 쪽 준비 (한 번만, sudo 필요):
#   sudo -u postgres psql -c "CREATE ROLE prefect WITH LOGIN PASSWORD '<여기 password 와 동일>';" \
#                         -c "CREATE DATABASE prefect OWNER prefect;"
# 비밀번호를 바꾸면 DB 쪽도 ALTER ROLE prefect WITH PASSWORD '...' 로 같이 바꿔야 함.
apiVersion: v1
kind: Secret
metadata:
  name: prefect-db
  namespace: prefect
type: Opaque
stringData:
  # URL 에 그대로 들어가므로 영숫자만 사용 (예: openssl rand -base64 24 | tr -d "/+=")
  password: "REPLACE_WITH_RANDOM_PASSWORD"
