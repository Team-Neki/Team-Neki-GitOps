# Prefect DB Secret 예시 파일 (문서용, 실제 값 없음)
#
# 사용법:
#   1) 이 파일을 secret.yaml 로 복사
#   2) password 를 실제 값으로 교체 (예: openssl rand -base64 24)
#   3) kubectl apply -f overlays/prefect/secret.yaml
#
# secret.yaml 은 .gitignore(**/secret.yaml)에 등록되어 커밋되지 않음.
# PostgreSQL StatefulSet(postgres.yaml)과 prefect-server(values-server.yaml)가 같은 Secret을 참조함.
# 주의: PostgreSQL 최초 초기화 이후 비밀번호를 바꾸려면 DB 안에서도 ALTER USER 로 바꿔야 함.
apiVersion: v1
kind: Secret
metadata:
  name: prefect-db
  namespace: prefect
type: Opaque
stringData:
  # URL 에 그대로 들어가므로 영숫자만 사용 (예: openssl rand -base64 24 | tr -d "/+=")
  password: "REPLACE_WITH_RANDOM_PASSWORD"
