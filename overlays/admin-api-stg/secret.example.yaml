# secret.yaml로 복사해 실제 값을 채운 뒤 직접 apply한다. secret.yaml은 gitignore 대상이다.
apiVersion: v1
kind: Secret
metadata:
  name: neki-admin-api-secret
  namespace: staging
type: Opaque
stringData:
  # DB 연결은 postgres staging 설정과 기존 yapp-secrets/JASYPT_PASSWORD를 사용한다.
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  # Google Console에 등록한 staging 콜백과 정확히 일치해야 한다.
  ADMIN_OAUTH_REDIRECT_URI: "http://localhost:8081/login/oauth2/code/google"
